name: Validate ROYAL AUDIO public asset hosting

on:
  pull_request:
    branches: [main]
    paths:
      - "audio/player.html"
      - "audio/assets/ogg/**"
      - ".github/workflows/deploy-royal-audio-pages.yml"
  push:
    branches: [main, fix/royal-audio-public-host-validation]
    paths:
      - "audio/player.html"
      - "audio/assets/ogg/**"
      - ".github/workflows/deploy-royal-audio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: royal-audio-public-host-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Verify public ROYAL AUDIO hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Verify private audio source is complete
        shell: bash
        run: |
          set -euo pipefail
          test -s audio/player.html
          count="$(find audio/assets/ogg -maxdepth 1 -type f -name '*.ogg' | wc -l)"
          test "$count" -eq 33
          echo "Validated $count local OGG files."

      - name: Verify the public player and every published audio asset
        shell: bash
        run: |
          set -euo pipefail
          base="https://ramistar900.github.io/royal-audio-player"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            "$base/" --output /dev/null
          while IFS= read -r file; do
            name="$(basename "$file")"
            echo "Checking public asset: $name"
            curl --fail --silent --show-error --location --retry 2 --max-time 30 \
              "$base/assets/ogg/$name" --output /dev/null
          done < <(find audio/assets/ogg -maxdepth 1 -type f -name '*.ogg' | sort)
          echo "All 33 audio assets are available from the public ROYAL AUDIO host."
