name: Package ROYAL Android Icons v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "icons/v3/**"
      - ".github/workflows/package-royal-icons-v3.yml"

permissions:
  contents: read

jobs:
  package-icons:
    name: Package SVG and Android XML icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Create distribution ZIP
        run: |
          mkdir -p dist
          zip -r dist/ROYAL_Android_Icons_v3.zip \
            icons/v3/README.md \
            icons/v3/svg \
            icons/v3/android/res/drawable

      - name: Verify package contents
        run: |
          test -s dist/ROYAL_Android_Icons_v3.zip
          unzip -l dist/ROYAL_Android_Icons_v3.zip
          test "$(unzip -Z1 dist/ROYAL_Android_Icons_v3.zip | grep -c '\.svg$')" -eq 10
          test "$(unzip -Z1 dist/ROYAL_Android_Icons_v3.zip | grep -c '\.xml$')" -eq 10

      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: ROYAL_Android_Icons_v3
          path: dist/ROYAL_Android_Icons_v3.zip
          if-no-files-found: error
          retention-days: 30
