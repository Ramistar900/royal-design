name: Validate ROYAL DESIGN V13 original 2D icons

on:
  pull_request:
    branches: [main]
    paths:
      - "icons/v13/2d/**"
      - "scripts/validate-v13-icons.py"
      - ".github/workflows/validate-royal-v13-icons.yml"
  push:
    branches: [main]
    paths:
      - "icons/v13/2d/**"
      - "scripts/validate-v13-icons.py"
      - ".github/workflows/validate-royal-v13-icons.yml"

permissions:
  contents: read

jobs:
  validate-v13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate V13 SVG assets and provenance
        run: python scripts/validate-v13-icons.py
