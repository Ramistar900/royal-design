name: Validate ROYAL AUDIO library

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - "audio/**"
      - "scripts/validate-audio-catalog.py"
      - ".github/workflows/validate-royal-audio.yml"
  push:
    branches: [main]
    paths:
      - "audio/**"
      - "scripts/validate-audio-catalog.py"
      - ".github/workflows/validate-royal-audio.yml"

permissions:
  contents: read

jobs:
  validate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ROYAL AUDIO catalog and assets
        run: python scripts/validate-audio-catalog.py

  build-assets:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'edited' &&
      github.event.pull_request.head.ref == 'feature/royal-audio-production' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/royal-audio-production
          persist-credentials: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build original effects and licensed natural recordings
        run: python3 scripts/build_royal_audio_assets.py

      - name: Validate all generated assets
        run: python3 scripts/validate-audio-catalog.py

      - name: Commit generated audio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets audio/catalog.json audio/licenses/ATTRIBUTIONS.md
          git commit -m "Build ROYAL AUDIO WAV and OGG assets"
          git push origin feature/royal-audio-production
