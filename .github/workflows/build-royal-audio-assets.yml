name: Build ROYAL AUDIO assets

on:
  push:
    branches:
      - feature/royal-audio-production
    paths:
      - ".github/workflows/build-royal-audio-assets.yml"
      - "audio/catalog.json"
      - "scripts/build_royal_audio_assets.py"
      - "scripts/validate-audio-catalog.py"

permissions:
  contents: write

jobs:
  build-and-verify-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/royal-audio-production
          persist-credentials: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build original cues and prepare licensed nature recordings
        run: python3 scripts/build_royal_audio_assets.py

      - name: Validate catalog, formats, file paths and licence evidence
        run: python3 scripts/validate-audio-catalog.py

      - name: Commit generated asset pairs and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets audio/catalog.json audio/licenses/ATTRIBUTIONS.md
          git commit -m "Build ROYAL AUDIO WAV and OGG assets"
          git push origin feature/royal-audio-production
