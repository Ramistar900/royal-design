name: Validate ROYAL Design App Gallery

on:
  pull_request:
    branches: [main]
    paths:
      - "icons/**"
      - "gallery/**"
      - "preview/royal-design/**"
      - "preview/v9-icon-catalog/**"
      - "README.md"
      - "scripts/validate-royal-design-gallery.py"
      - ".github/workflows/validate-royal-design-gallery.yml"
  push:
    branches: [main]
    paths:
      - "icons/**"
      - "gallery/**"
      - "preview/royal-design/**"
      - "preview/v9-icon-catalog/**"
      - "README.md"
      - "scripts/validate-royal-design-gallery.py"
      - ".github/workflows/validate-royal-design-gallery.yml"

permissions:
  contents: read

jobs:
  validate-app-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate application icon collections and 2D/3D pairs
        run: python scripts/validate-royal-design-gallery.py
