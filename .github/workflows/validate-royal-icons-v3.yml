name: Validate ROYAL Android Icons v3, v5, v6, v7 and v8

on:
  pull_request:
    branches: [main]
    paths:
      - "icons/v3/**"
      - "icons/v5/**"
      - "icons/v6/**"
      - "icons/v7/**"
      - "icons/v8/**"
      - "icons/v7/**"
      - "icon-validation/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/validate-royal-icons-v3.yml"
  push:
    branches: [main]
    paths:
      - "icons/v3/**"
      - "icons/v5/**"
      - "icons/v6/**"
      - "icon-validation/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/validate-royal-icons-v3.yml"

permissions:
  contents: read

jobs:
  android-resource-build:
    name: Compile Android icon resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Compile icon resources
        run: gradle --no-daemon :icon-validation:assembleDebug
