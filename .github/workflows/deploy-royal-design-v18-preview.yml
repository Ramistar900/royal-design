name: Deploy ROYAL Design V18 Preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-royal-design-v18-preview.yml"
      - "gallery/index.html"
      - "icons/**"
      - "preview/royal-design/v18/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-royal-design-v18-preview.yml"
      - "gallery/index.html"
      - "icons/**"
      - "preview/royal-design/v18/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: royal-design-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete library from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout complete V16/V17 source library
        uses: actions/checkout@v4
        with:
          repository: Ramistar900/royal-design-gallery
          ref: main
          path: royal-design-gallery

      - name: Prepare complete ROYAL Design gallery and preserve audio pages
        run: |
          set -euo pipefail
          mkdir -p _site/audio _site/audio/ui-sounds _site/icons _site/preview/royal-design _site/royal-design-gallery/icons
          cp -R royal-design-gallery/icons/v16 _site/royal-design-gallery/icons/
          cp -R royal-design-gallery/icons/v17 _site/royal-design-gallery/icons/
          cp -R royal-design-gallery/packages _site/royal-design-gallery/
          cp -R royal-design-gallery/sources _site/royal-design-gallery/
          find royal-design-gallery -maxdepth 1 -type f -name '*.zip' -exec cp {} _site/royal-design-gallery/ \;
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('royal-design-gallery')
          files = []
          def collect(path, version, group):
              if not path.exists():
                  return
              for item in sorted(path.rglob('*')):
                  if item.is_file() and item.suffix.lower() in {'.svg', '.xml', '.png', '.webp', '.gif'}:
                      files.append({
                          'path': ('royal-design-gallery/' + item.relative_to(root).as_posix()) if item.is_relative_to(root) else item.as_posix(),
                          'version': version,
                          'group': group,
                          'motion': 'motion' in item.parts or 'animated' in item.parts
                      })
          collect(root / 'packages/royal-design-shared-icon-package', 'V16', 'V16 · حزمة ROYAL الأصلية')
          collect(root / 'packages/restaurant-tv-icons-v2-transparent', 'V17', 'V17 · المطاعم والتلفاز')
          collect(root / 'icons/v17', 'V17', 'V17 · مكتبة Android وROYAL')
          collect(Path('preview/royal-design/v18'), 'V18', 'V18 · المطاعم والتلفاز')
          archives = []
          for item in sorted(root.rglob('*.zip')):
              archives.append({
                  'path': 'royal-design-gallery/' + item.relative_to(root).as_posix(),
                  'name': item.name,
                  'version': 'V16/V17'
              })
          import json as json_module
          v16_catalog = json.loads((root / 'icons/v16/uploaded-royal-icon-package/catalog.json').read_text(encoding='utf-8'))
          v17_catalog = json.loads((root / 'icons/v17/royal-library/catalog.json').read_text(encoding='utf-8'))
          counts = {
              'v16_svg': sum(1 for x in files if x['version'] == 'V16' and x['path'].endswith('.svg')),
              'v17_svg': sum(1 for x in files if x['version'] == 'V17' and x['path'].endswith('.svg')),
              'v17_archive_svg': sum(1 for x in files if x['path'].startswith('royal-design-gallery/packages/') and x['path'].endswith('.svg')),
              'v17_extra_svg': sum(1 for x in files if x['path'].startswith('royal-design-gallery/icons/v17/') and x['path'].endswith('.svg')),
              'v17_xml': sum(1 for x in files if x['version'] == 'V17' and x['path'].endswith('.xml')),
              'v18_svg': sum(1 for x in files if x['version'] == 'V18' and x['path'].endswith('.svg')),
              'v16_catalog_entries': len(v16_catalog.get('icons', [])),
              'v17_catalog_entries': len(v17_catalog.get('icons', [])),
              'v17_catalog_source_svg': v17_catalog.get('asset_totals', {}).get('source_archive_svg_files', 0),
              'v17_unique_source_svg_contents': v17_catalog.get('asset_totals', {}).get('unique_source_svg_contents', 0)
          }
          assert counts['v16_svg'] == 262, counts
          assert counts['v17_archive_svg'] == 550, counts
          assert counts['v17_extra_svg'] == 52, counts
          assert counts['v17_xml'] == 22, counts
          assert counts['v18_svg'] == 451, counts
          assert counts['v16_catalog_entries'] == 99, counts
          assert counts['v17_catalog_entries'] == 413, counts
          assert counts['v17_catalog_source_svg'] == 524, counts
          assert counts['v17_unique_source_svg_contents'] == 212, counts
          Path('_site/source-assets.json').write_text(
              json.dumps({'files': files, 'archives': archives, 'counts': counts}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print('Complete source inventory validated:', counts, 'archives:', len(archives))
          PY
          cp -R icons/. _site/icons/
          cp gallery/index.html _site/index.html
          cp audio/player.html _site/audio/player.html
          mkdir -p _site/audio/assets
          cp -R audio/assets/ogg _site/audio/assets/ogg
          cp audio/ui-sounds/manifest.json _site/audio/ui-sounds/manifest.json
          cp -R audio/ui-sounds/sounds _site/audio/ui-sounds/sounds
          cp audio/ui-sounds/player.html _site/audio/ui-sounds/player.html
          cp -R preview/royal-design/v18 _site/preview/royal-design/v18
          test -f _site/source-assets.json
          test -f _site/royal-design-gallery/icons/v16/uploaded-royal-icon-package/catalog.json
          test -f _site/royal-design-gallery/icons/v17/royal-library/catalog.json
          test -f _site/index.html
          test -f _site/icons/catalog.json
          test -f _site/icons/app-collections.json
          test "$(find _site/audio/assets/ogg -maxdepth 1 -type f -name '*.ogg' | wc -l)" -eq 33
          test "$(find _site/audio/ui-sounds/sounds -type f -name '*.wav' | wc -l)" -eq 49
          test "$(find _site/preview/royal-design/v18 -type f -name '*.svg' | wc -l)" -eq 451
          test -f _site/preview/royal-design/v18/index.html
          echo "Prepared the full indexed icon library, V18 preview, and existing audio pages."
          echo "All icon source files are published unchanged; animated SVG assets remain separate."
          find _site -type f | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy complete gallery to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
