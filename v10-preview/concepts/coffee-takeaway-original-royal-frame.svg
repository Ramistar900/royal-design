<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ROYAL V10 — Original Takeaway Cup with Royal Glass Frame</title>
  <desc id="desc">Review concept using the unchanged original 3dicons Takeaway Cup render. Only the surrounding glass presentation and subtle gold lighting are customized.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17242B"/>
      <stop offset=".55" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1C4"/>
      <stop offset=".48" stop-color="#D7B46A"/>
      <stop offset="1" stop-color="#8C642B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9FFFF" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#9BCBD0" stop-opacity=".045"/>
      <stop offset="1" stop-color="#DDBD78" stop-opacity=".11"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#D9B76B" stop-opacity=".19"/>
      <stop offset=".72" stop-color="#D9B76B" stop-opacity=".055"/>
      <stop offset="1" stop-color="#D9B76B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="plateShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
      <feOffset dy="10" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope=".42"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="42" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="205" fill="url(#halo)"/>
  <circle cx="256" cy="240" r="160" fill="#D7B46A" opacity=".10" filter="url(#softGlow)"/>

  <!-- Quiet glass presentation plate; the original icon itself is not redrawn. -->
  <g filter="url(#plateShadow)">
    <rect x="74" y="45" width="364" height="364" rx="74" fill="url(#glass)" stroke="url(#gold)" stroke-opacity=".52" stroke-width="2"/>
    <rect x="82" y="53" width="348" height="348" rx="67" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1.5"/>
    <path d="M112 75Q126 58 153 58H274" fill="none" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
    <path d="M390 356Q378 389 344 393" fill="none" stroke="#E7C77E" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Exact original 3dicons render, linked unchanged. -->
  <image href="https://3dicons.sgp1.cdn.digitaloceanspaces.com/v1/dynamic/color/takeaway-cup-dynamic-color.png"
         x="91" y="62" width="330" height="330"
         preserveAspectRatio="xMidYMid meet"/>

  <path d="M197 423H315" stroke="url(#gold)" stroke-opacity=".62" stroke-width="1.5" stroke-linecap="round"/>
  <text x="256" y="454" text-anchor="middle" fill="#E8D19A" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">ROYAL · COFFEE</text>
  <text x="256" y="477" text-anchor="middle" fill="#AAB7BD" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.6">ORIGINAL SHAPE · GLASS FRAME STUDY</text>
</svg>