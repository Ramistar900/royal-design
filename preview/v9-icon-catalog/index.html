<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10100f"><title>ROYAL Design — معاينة الأيقونات</title>
<style>
:root{color-scheme:dark;--bg:#10100f;--panel:#1b1b19;--line:#37352d;--gold:#d9b65b;--muted:#aaa69a;--green:#55c79a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292419 0,#10100f 48%);color:#f6f1e5;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 18px 18px;max-width:1100px;margin:auto}h1{margin:0;color:var(--gold);font-size:clamp(25px,5vw,38px)}header p{color:var(--muted);margin:8px 0 18px}
.tools{display:flex;gap:9px;flex-wrap:wrap}.tools input{flex:1;min-width:210px;background:#191917;border:1px solid var(--line);color:white;padding:12px 14px;border-radius:12px;font:inherit}
button,.mode{background:#24231f;border:1px solid var(--line);color:#f6f1e5;border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer}.mode[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
main{max-width:1100px;margin:auto;padding:0 18px 50px}.group{margin:22px 0 30px}.group h2{font-size:19px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{background:linear-gradient(145deg,#24231f,#181816);border:1px solid var(--line);border-radius:15px;padding:13px;min-width:0}
.preview{height:104px;display:grid;place-items:center;background:#11110f;border-radius:11px;margin-bottom:10px}.preview img{width:84px;height:84px;object-fit:contain}.name{font-weight:700;margin:4px 0 8px}.id{direction:ltr;text-align:left;overflow-wrap:anywhere;font:12px ui-monospace,monospace;color:#e7c96f;background:#302b1d;border:1px solid #51452a;padding:7px;border-radius:8px;min-height:43px;display:flex;align-items:center;justify-content:space-between;gap:5px}.copy{padding:5px 7px;flex:none;border-radius:7px;color:var(--gold)}.copy span{font-size:17px}.actions{display:flex;gap:7px;margin-top:9px}.actions button{font-size:12px;flex:1;padding:8px 4px}.actions button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:40px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body>
<header><h1>ROYAL Design</h1><p>معرض اختيار أيقونات المطاعم والطلبات — 37 أيقونة بمعرّفاتها البرمجية الأصلية</p>
<div class="tools"><input id="search" type="search" placeholder="ابحث بالاسم أو المعرّف البرمجي…" aria-label="بحث"><button id="static" class="mode" aria-pressed="true">ثابتة</button><button id="animated" class="mode" aria-pressed="false">متحركة</button></div></header>
<main id="catalog"></main><footer>المصدر: ROYAL Design / icons/v9/cafe-orders — المعاينة لا تغيّر أي تطبيق.</footer>
<script>
const groups=[{"title":"الطعام والمشروبات","icon":"☕","items":[["royal_coffee","قهوة"],["royal_juice","عصير"],["royal_food_shawarma","شاورما"],["royal_food_burger","برغر"],["royal_food_pizza","بيتزا"],["royal_food_dessert","حلويات"],["royal_food_tea","شاي"],["royal_food_sandwich","ساندويتش"],["royal_food_ice_cream","مثلجات"],["royal_food_salad","سلطة"]]},{"title":"الشراء والطلبات والتوصيل","icon":"🛍️","items":[["royal_purchase_started","بدء الشراء"],["royal_purchase_in_progress","الشراء جارٍ"],["royal_purchase_complete","اكتمل الشراء"],["royal_order_new","طلب جديد"],["royal_order_in_progress","الطلب قيد التنفيذ"],["royal_order_accepted","تم قبول الطلب"],["royal_order_confirmed","تم تأكيد الطلب"],["royal_order_preparing","جاري التحضير"],["royal_order_ready","الطلب جاهز"],["royal_order_pickup","استلام الطلب"],["royal_delivery_out","خرج للتوصيل"],["royal_delivery_progress","التوصيل جارٍ"],["royal_order_delivered","تم التسليم"],["royal_order_cancelled","تم إلغاء الطلب"],["royal_order_cancelled_customer","إلغاء من الزبون"],["royal_order_cancelled_restaurant","إلغاء من المطعم"],["royal_order_reorder","إعادة الطلب"]]},{"title":"الحجوزات","icon":"📅","items":[["royal_booking_table_available","طاولة متاحة"],["royal_booking_table_occupied","طاولة مشغولة"],["royal_booking_new","حجز جديد"],["royal_booking_confirmed","تم تأكيد الحجز"],["royal_booking_waiting","حجز قيد الانتظار"],["royal_booking_cancelled","تم إلغاء الحجز"]]},{"title":"الدفع","icon":"💳","items":[["royal_payment_pending","الدفع قيد الانتظار"],["royal_payment_success","دفع ناجح"],["royal_payment_failed","فشل الدفع"],["royal_payment_refund","استرداد المبلغ"]]}];let motion=false;const root=document.getElementById('catalog'),search=document.getElementById('search');
function draw(){root.innerHTML='';let total=0;for(const group of groups){const cards=group.items.filter(([id,name])=>(id+' '+name).toLowerCase().includes(search.value.trim().toLowerCase()));if(!cards.length)continue;total+=cards.length;const section=document.createElement('section');section.className='group';const h=document.createElement('h2');h.textContent=group.icon+'  '+group.title+' ('+cards.length+')';section.append(h);const grid=document.createElement('div');grid.className='grid';for(const [id,name] of cards){const card=document.createElement('article');card.className='card';const preview=document.createElement('div');preview.className='preview';const img=document.createElement('img');img.loading='lazy';img.alt=name;img.src='../icons/v9/cafe-orders/'+(motion?'motion/svg/'+id+'_animated.svg':'svg/'+id+'.svg');preview.append(img);const label=document.createElement('div');label.className='name';label.textContent=name;const code=document.createElement('div');code.className='id';const txt=document.createElement('span');txt.textContent=id;const copy=document.createElement('button');copy.className='copy';copy.type='button';copy.title='نسخ المعرّف';copy.setAttribute('aria-label','نسخ '+id);copy.innerHTML='<span>▢</span>';copy.onclick=async()=>{try{await navigator.clipboard.writeText(id);copy.innerHTML='<span>✓</span>';setTimeout(()=>copy.innerHTML='<span>▢</span>',1100)}catch(e){const t=document.createElement('textarea');t.value=id;document.body.append(t);t.select();document.execCommand('copy');t.remove();copy.innerHTML='<span>✓</span>'}};code.append(txt,copy);const actions=document.createElement('div');actions.className='actions';const b=document.createElement('button');b.textContent='نسخ المعرّف';b.onclick=()=>copy.click();const file=document.createElement('button');file.textContent='ملف SVG';file.onclick=()=>window.open('../icons/v9/cafe-orders/'+(motion?'motion/svg/'+id+'_animated.svg':'svg/'+id+'.svg'),'_blank','noopener');actions.append(b,file);card.append(preview,label,code,actions);grid.append(card)}section.append(grid);root.append(section)}if(!total){const e=document.createElement('div');e.className='empty';e.textContent='لا توجد أيقونات مطابقة للبحث.';root.append(e)}}
document.getElementById('static').onclick=()=>{motion=false;document.getElementById('static').setAttribute('aria-pressed','true');document.getElementById('animated').setAttribute('aria-pressed','false');draw()};
document.getElementById('animated').onclick=()=>{motion=true;document.getElementById('static').setAttribute('aria-pressed','false');document.getElementById('animated').setAttribute('aria-pressed','true');draw()};
search.addEventListener('input',draw);draw();
</script></body></html>
